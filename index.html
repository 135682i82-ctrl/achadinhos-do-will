<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achadinhos do Will</title><style>
body{font-family:Arial;margin:0;background:#f4f6f8;color:#17202a}.top{background:#071018;color:#fff;padding:20px}.top h1{margin:0;color:#fff}.top span{color:#ff6500}.wrap{max-width:1100px;margin:auto;padding:25px}.hero{background:#241006;color:#fff;padding:35px;border-radius:16px}.hero h2{font-size:40px}.btn{display:inline-block;background:#ff6500;color:white;padding:11px 16px;border-radius:8px;text-decoration:none}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:20px}.card{background:white;border-radius:14px;padding:15px;border:1px solid #ddd}.pic{height:130px;background:#eef2f5;display:flex;align-items:center;justify-content:center;font-size:65px}.price{font-size:21px;font-weight:bold;margin:8px 0}.buy{display:block;background:#ff6500;color:#fff;text-align:center;padding:10px;border-radius:8px;text-decoration:none}.old{text-decoration:line-through;color:#999}.admin{position:fixed;right:15px;bottom:15px;background:#071018;color:#fff;padding:9px 13px;border-radius:8px;text-decoration:none;font-size:12px}</style></head>
<body><header class="top"><div class="wrap"><h1>🛒 Achadinhos <span>do Will</span></h1><p>As melhores ofertas, em um só lugar!</p></div></header>
<main class="wrap"><section class="hero"><h2>🔥 Achadinhos da Shopee</h2><p>Encontre produtos e ofertas selecionadas.</p></section><h2>Ofertas do Dia</h2><div id="products" class="products"></div></main><a class="admin" href="/admin">Área administrativa</a>
<script>
fetch("/api/products").then(r=>r.json()).then(ps=>{document.querySelector("#products").innerHTML=ps.map(p=>`<article class="card"><div class="pic">${p.emoji}</div><h3>${p.name}</h3><div>${p.rating||""}</div><div class="old">${p.oldPrice||""}</div><div class="price">${p.price}</div><a class="buy" href="${p.link}" target="_blank" rel="noopener">🛒 Ver na Shopee</a></article>`).join("")})
</script></body></html>
