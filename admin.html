<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Achadinhos do Will</title><style>
body{font-family:Arial;background:#0b1219;color:#fff;margin:0}.wrap{max-width:900px;margin:auto;padding:25px}.panel{background:#111f2c;padding:22px;border-radius:14px;margin-bottom:20px}input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0 12px;border-radius:8px;border:1px solid #334553;background:#0b151e;color:white}button{padding:11px 15px;border:0;border-radius:8px;background:#ff6500;color:#fff;font-weight:bold;cursor:pointer}.muted{color:#aeb8c4}.item{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid #2b3b48;padding:15px 0}.danger{background:#b52a1d}.hidden{display:none}.msg{padding:10px;border-radius:8px;background:#1d3344;margin:10px 0}</style></head>
<body><div class="wrap"><h1>🔐 Painel do Achadinhos do Will</h1><p class="muted">Somente você deve usar esta área.</p>
<div id="login" class="panel"><h2>Entrar</h2><input id="password" type="password" placeholder="Senha de administrador"><button onclick="login()">Entrar</button><div id="loginMsg" class="msg hidden"></div></div>
<div id="app" class="hidden"><div class="panel"><button onclick="logout()">Sair</button><h2>Adicionar achadinho</h2><input id="name" placeholder="Nome do produto"><input id="price" placeholder="Preço (ex.: R$ 59,90)"><input id="oldPrice" placeholder="Preço antigo (opcional)"><input id="discount" placeholder="Desconto (ex.: -30%)"><input id="rating" placeholder="Avaliação (ex.: ⭐ 4,8)"><input id="emoji" placeholder="Emoji (ex.: 🎧)"><input id="link" placeholder="Seu link de afiliado da Shopee"><button onclick="add()">Adicionar produto</button><div id="msg" class="msg hidden"></div></div>
<div class="panel"><h2>Produtos cadastrados</h2><div id="list"></div></div></div></div>
<script>
async function check(){let r=await fetch("/api/me");let x=await r.json(); if(x.admin){login.style.display="none";app.classList.remove("hidden");load()}else{login.style.display="block";app.classList.add("hidden")}}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});let x=await r.json();if(r.ok)check();else{loginMsg.textContent=x.error;loginMsg.classList.remove("hidden")}}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
async function load(){let ps=await (await fetch("/api/products")).json();list.innerHTML=ps.map(p=>`<div class="item"><div>${p.emoji} <b>${p.name}</b><br><span class="muted">${p.price} · ${p.link}</span></div><button class="danger" onclick="del('${p.id}')">Excluir</button></div>`).join("")||"<p class='muted'>Nenhum produto.</p>"}
async function add(){let p={name:name.value,price:price.value,oldPrice:oldPrice.value,discount:discount.value,rating:rating.value,emoji:emoji.value||"🛍️",link:link.value};let r=await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});let x=await r.json();msg.textContent=r.ok?"Produto adicionado!":x.error;msg.classList.remove("hidden");if(r.ok){document.querySelectorAll("#name,#price,#oldPrice,#discount,#rating,#emoji,#link").forEach(e=>e.value="");load()}}
async function del(id){if(!confirm("Excluir este produto?"))return;await fetch("/api/products/"+id,{method:"DELETE"});load()} check();
</script></body></html>
